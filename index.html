<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quà cho Tuệ Anh 💜</title>
<style>
  :root{--bg1:#2a0a45;--bg2:#6a1b9a;--pink:#ff7ce5;--lav:#d9b8ff;--text:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Comic Sans MS","Chalkboard SE","Segoe Print",cursive;
    background:radial-gradient(circle at 30% 20%,var(--bg2),var(--bg1) 70%);
    color:var(--text);overflow-x:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100%;padding:24px;text-align:center;
  }
  .hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .hearts span{position:absolute;bottom:-60px;animation:rise linear infinite;
    filter:drop-shadow(0 0 6px var(--pink));opacity:.85}
  @keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
  h1{font-size:clamp(1.6rem,6vw,2.6rem);text-shadow:0 0 14px var(--pink);margin-bottom:6px;position:relative}
  .sub{color:var(--lav);margin-bottom:28px;position:relative}
  .gift{
    font-size:clamp(6rem,28vw,9rem);background:none;border:0;cursor:pointer;line-height:1;
    animation:bounce 1.4s ease-in-out infinite;position:relative;
    filter:drop-shadow(0 0 18px var(--pink));
  }
  .gift:focus-visible{outline:3px solid var(--lav);outline-offset:8px;border-radius:16px}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
  .hint{margin-top:10px;color:var(--lav);position:relative}
  .reveal{display:none;position:relative;max-width:420px;width:100%;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
  .reveal.show{display:block}
  @keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
  .reveal img{width:100%;border-radius:20px;border:4px solid var(--pink);box-shadow:0 0 30px var(--pink)}
  .msg{margin-top:16px;font-size:clamp(1.3rem,5vw,2rem);text-shadow:0 0 12px var(--pink)}
  .again{margin-top:18px;background:var(--pink);color:#3a0a5a;border:0;border-radius:99px;
    padding:10px 22px;font:inherit;cursor:pointer}
  @media (prefers-reduced-motion:reduce){.gift,.hearts span{animation:none}}
</style>
</head>
<body>
<div class="hearts" id="hearts" aria-hidden="true"></div>

<div id="start">
  <h1>💜 Gửi Tuệ Anh 💜</h1>
  <p class="sub">Một món quà siêu ngọt ngào đang chờ bạn~</p>
  <button class="gift" id="gift" aria-label="Mở hộp quà">🎁</button>
  <p class="hint">Bấm vào hộp quà đi nè 💕</p>
</div>

  <p class="msg">Tuệ Anh ăn cứt ngày mới tốt lành 💜</p>

</div>

<script>
  const box=document.getElementById('hearts'),icons=['💜','💗','💖','💕','🟣'];
  for(let i=0;i<28;i++){
    const s=document.createElement('span');
    s.textContent=icons[i%icons.length];
    s.style.left=Math.random()*100+'%';
    s.style.fontSize=(16+Math.random()*34)+'px';
    s.style.animationDuration=(6+Math.random()*8)+'s';
    s.style.animationDelay=(-Math.random()*12)+'s';
    box.appendChild(s);
  }
  const start=document.getElementById('start'),reveal=document.getElementById('reveal');
  document.getElementById('gift').onclick=()=>{start.style.display='none';reveal.classList.add('show')};
  document.getElementById('again').onclick=()=>{reveal.classList.remove('show');start.style.display=''};
</script>
